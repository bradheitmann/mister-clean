#:schema schemas/charter-toml.schema.json
charter_version = "1"
spec_version = "1"
project = "mister-clean"
owner = "repository owner; operated by the project PM"
# The tiniest end-to-end live run that must be green before anything scales.
[slice_zero]
description = "The offline scorer scores saved answers of at least three model subjects, each bound to its harness log, on two synthetic case sets (one decision-shaped task with a label oracle, one exact-text task); it calls no model and its reports reproduce byte for byte (charter/DONE/slice-zero.md, proof 6)"
command = "bun offline-scorer/score.ts <set>.case-set.json <private real-run folder>/<set>.answers.jsonl, for the sets json-validity and canonical-json in the scorer's slice-zero folder"
proven_on = ""          # ISO date when it last ran green on real infrastructure, else empty
# Verification is a loop: budget it.
[verification_budget]
qa_attempts_per_slice = 3
repair_cycles_per_slice = 1
review_families_required = 2   # author and verifier from different model families
