#:schema ../schemas/charter-toml.schema.json
charter_version = "1"
spec_version = "1"
project = "mister-clean"
owner = "repository owner; operated by the project PM"
# The tiniest end-to-end live run that must be green before anything scales.
[slice_zero]
description = "One recorded field failure (case CS-001 from the 2026-10-31 field window) replayed with its control agent in an isolated worktree until it meets or misses its repeat floor, written as a durable eval case that cites two agent cards, the constant verifier and the base commit, and read back by a validator"
command = "node bin/mister-clean.js eval-case validate field-evals/2026-10-31-window/cases/CS-001.eval.json --repo . --require-bound verifier,base_commit"
# Real infrastructure for this command: the record's verifier and base commits are pinned to an evidence manifest
# that names the source project, so it is never vendored here. The validator reads MISTER_CLEAN_EVIDENCE_ROOT
# (a private directory outside every repository holding that manifest) and MISTER_CLEAN_SOURCE_SPECIFICATION_PIPELINE
# (a local clone of the source seam). Strict mode accepts only class `recomputed` for the verifier and base
# commits: the publisher commit must carry the manifest bytes, and the evaluator pins are recomputed from the clone
# at each base commit. Without both the command refuses with binding_required, which is the correct answer on a
# host that lacks the evidence. See README "Eval cases" for how a third party obtains the manifest.
proven_on = ""          # ISO date when it last ran green on real infrastructure, else empty
# Verification is a loop: budget it.
[verification_budget]
qa_attempts_per_slice = 3
repair_cycles_per_slice = 1
review_families_required = 2   # author and verifier from different model families
