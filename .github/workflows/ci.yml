name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The serialized Node matrix alone has a measured runtime above 18 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.3
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Reconstruct and verify the exact candidate in one clean capsule
        run: pnpm run ci:check
      - name: View-ablation comparator self-test (ablation-replay/1)
        run: bun ablations/view-ab.ts --self-test
      # Slice Zero: the scorer calls no model. Each fixture run must reproduce
      # its committed report byte for byte.
      - name: Offline scorer self-test, oracle check and fixture reports (eval-score/1)
        run: |
          bun offline-scorer/score.ts --self-test
          bun offline-scorer/slice-zero/oracle-check.ts
          bun offline-scorer/score.ts offline-scorer/slice-zero/json-validity.case-set.json offline-scorer/slice-zero/json-validity.fixture.answers.jsonl > "$RUNNER_TEMP/json-validity.report.json"
          cmp "$RUNNER_TEMP/json-validity.report.json" offline-scorer/slice-zero/json-validity.fixture.report.json
          bun offline-scorer/score.ts offline-scorer/slice-zero/canonical-json.case-set.json offline-scorer/slice-zero/canonical-json.fixture.answers.jsonl > "$RUNNER_TEMP/canonical-json.report.json"
          cmp "$RUNNER_TEMP/canonical-json.report.json" offline-scorer/slice-zero/canonical-json.fixture.report.json
      - name: Verify strict TypeScript intake helper
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsc --project tsconfig.campaign.json --noEmit
      # rustup picks the toolchain from the working directory, never from
      # the manifest path given to cargo, so each crate's gates run in its folder and
      # first prove that the toolchain named in its rust-toolchain.toml ran.
      - name: Verify campaign SQLite reader on its pinned toolchain
        working-directory: tools/campaign-query
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install --no-self-update "$channel" --profile minimal
          rustc --version | tee /dev/stderr | grep -F "rustc $channel "
          cargo test --locked
      - name: Verify campaign observer on its pinned toolchain
        working-directory: tools/campaign-observer
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          minor=$(printf '%s\n' "$channel" | cut -d. -f2)
          rustup toolchain install --no-self-update "$channel" --profile minimal --component clippy
          rustc --version | tee /dev/stderr | grep -F "rustc $channel "
          clippy-driver --version
          cargo clippy --version | tee /dev/stderr | grep -F "clippy 0.1.$minor "
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
      # The release-archive source check (generate_release_attestation.ts
      # --source-check) regenerates MANIFEST.sha256 from the attested package
      # surface of THIS checkout, which includes the built dist/ outputs.
      # ci:check builds only inside its private capsule, so the tagged
      # checkout must be built in place first or the check reports the
      # tracked manifest as stale (observed on tag v7.0.0, run 35784649561).
      # No untrusted event input is used here.
      - name: Build the tagged checkout in place for the release source check
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm install --frozen-lockfile && pnpm run build:raw && pnpm run manifest:package:check
      - name: Verify exact, read-only tagged release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/prepare_release_archive.ts --destination "$RUNNER_TEMP/mister-clean-release"
      - name: Retain tagged release archive and receipt
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mister-clean-${{ github.ref_name }}-verified-release
          path: ${{ runner.temp }}/mister-clean-release/
          if-no-files-found: error

  # Charter check (pattern C, template v3). Non-required, so a red charter job
  # never blocks a merge; honest, so it never reports success for a check it did
  # not run. While the charter source is unreachable from this runner the probe
  # FAILS the job as "charter NOT CHECKED" (an error annotation and a NOT CHECKED
  # step summary), because v2's green on that path checked nothing. When the
  # source is reachable it installs the pinned commit and enforces
  # `check --strict` with no edit here. Local hooks and the pre-push
  # `check --strict` enforce Charter meanwhile.
  charter:
    name: charter (non-required; fails as NOT CHECKED while the charter source is unreachable)
    runs-on: ubuntu-latest
    env:
      CHARTER_REV: f006adbed3b89f43be8f6c79e6d791a7865cc994
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0  # strict checks that STATE's recorded HEAD exists
      - name: probe the charter source
        id: probe
        run: |
          if GIT_TERMINAL_PROMPT=0 git -C "$RUNNER_TEMP" ls-remote --exit-code https://github.com/bradheitmann/charter HEAD >/dev/null 2>&1; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::error title=charter NOT CHECKED::charter source unreachable from this runner; nothing was checked"
            echo "charter NOT CHECKED: the charter source is unreachable from this runner, so no charter check ran. This job is non-required: it is red to say the check did not happen, not to block a merge." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - if: steps.probe.outputs.reachable == 'true'
        uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759  # 1.88.0
        with:
          toolchain: 1.88.0
      - if: steps.probe.outputs.reachable == 'true'
        name: charter check --strict at the pinned commit
        run: |
          cargo +1.88.0 install --locked --git https://github.com/bradheitmann/charter --rev "$CHARTER_REV" charter
          charter --version | grep -F "($CHARTER_REV)"
          charter check --strict
