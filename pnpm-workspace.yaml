allowBuilds:
  core-js-pure: false
  esbuild: true
  workerd: true

# Patched HTTP/URI transitive dependencies used by the Agents MCP stack.
overrides:
  fast-uri: "^3.1.8"
  # wrangler>miniflare pins undici 7.29.1 exactly; that version carries four
  # high advisories (TLS certificate validation bypass, DoS via TLS 1.2
  # renegotiation, cache poisoning, unhandled-exception DoS) plus four
  # moderate ones, all fixed in 7.30.1. An override is the only way to move
  # an exact transitive pin, so stay inside major 7.
  undici: "^7.30.1"
  # express 5 (via agents>@modelcontextprotocol/sdk) pulls body-parser 2.3.0,
  # which is vulnerable to a denial of service fixed in 2.4.0.
  body-parser: "^2.4.0"
  # @modelcontextprotocol/{client,core,server} keep their own zod 4.4.3
  # snapshot, which GHSA-mrhx-c7xc-m3w5 (memory exhaustion) flags; raising
  # the direct pin alone leaves those snapshots behind. They all declare
  # zod ^4.2.0, so the override stays inside every declared range.
  zod: "^4.6.7"
  proxy-addr: "^2.0.8"
  qs: "^6.16.0"
  hono: "^4.13.7"
  ip-address: "^10.7.1"
